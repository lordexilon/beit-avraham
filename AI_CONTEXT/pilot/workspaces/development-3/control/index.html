<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio por líneas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f3f0; color: #202b26; font: 17px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.2; }
    .intro { color: #48594f; }
    section { margin: 16px 0; padding: 16px; border: 1px solid #c9d3cc; border-radius: 12px; background: white; }
    button { display: block; width: 100%; padding: 14px; border: 2px solid #b8c6be; border-radius: 8px; text-align: left; background: #fff; color: inherit; font: inherit; overflow-wrap: anywhere; cursor: pointer; }
    button[aria-pressed="true"] { background: #e5f2e9; border-color: #296641; }
    button[aria-pressed="true"]::before { content: 'Seleccionada · '; font-weight: 700; }
    label { display: block; margin-top: 14px; font-size: 15px; }
    [hidden] { display: none; }
    textarea { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #879a8e; border-radius: 6px; font: inherit; resize: vertical; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #2165b3; outline-offset: 3px; }
    footer { margin-top: 24px; color: #48594f; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Estudio por líneas</h1>
    <p class="intro">Selecciona una línea y escribe tu reflexión. Puedes usar Tab para desplazarte y Enter o Espacio para seleccionar.</p>
    <div id="study" aria-label="Líneas de estudio"></div>
    <footer>Las notas se conservan al cambiar de línea durante esta sesión. Al recargar o cerrar la página se borran.</footer>
  </main>
  <script src="./study.cjs"></script>
  <script>
    window.study = Study.mount(document.getElementById('study'), [
      { id: 'a', text: 'Escuchar con atención es el primer paso para comprender.' },
      { id: 'b', text: 'Una pregunta bien formulada abre espacio para aprender.' },
      { id: 'c', text: '<script>Este texto se muestra literal y no se ejecuta.<\/script>' }
    ]);
  </script>
</body>
</html>
