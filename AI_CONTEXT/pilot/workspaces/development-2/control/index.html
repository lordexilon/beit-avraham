<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio por líneas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #f3f2ed; color: #202a28; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: auto; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); margin: 0 0 12px; }
    .study-lines { display: grid; gap: 10px; margin: 24px 0; }
    button, textarea { font: inherit; border: 1px solid #75827d; border-radius: 8px; }
    button { padding: 14px; text-align: left; cursor: pointer; background: white; color: inherit; overflow-wrap: anywhere; }
    button[aria-pressed="true"] { background: #e0eee7; border: 2px solid #235c43; padding: 13px; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #3c67aa; outline-offset: 3px; }
    label { display: block; font-weight: 600; }
    textarea { display: block; width: 100%; min-width: 0; margin-top: 8px; padding: 12px; resize: vertical; background: white; color: inherit; font-weight: 400; }
    [role="status"] { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Estudio por líneas</h1>
    <p>Seleccioná una línea para escribir una nota. Las notas se conservan al cambiar de línea y se borran al recargar la página.</p>
    <p>Usá Tab y Enter para seleccionar, o las flechas para recorrer las líneas.</p>
    <section id="study" aria-label="Ejercicio de estudio"></section>
  </main>
  <script src="study.cjs"></script>
  <script>
    Study.mount(document.getElementById('study'), [
      { id: '1', text: 'Escuchar con atención es el primer paso para comprender.' },
      { id: '2', text: 'Una pregunta puede abrir nuevas formas de leer.' },
      { id: '3', text: '<script>Este texto se muestra literalmente.<\/script>' }
    ]);
  </script>
</body>
</html>
